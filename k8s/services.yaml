# Both ClusterIP: the Ingress is the only way in, keeping everything one origin.
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: lecho
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: lecho
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
