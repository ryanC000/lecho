# `kubectl apply -k k8s/`; secret.example.yaml is documentation, so not listed.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lecho

resources:
  - namespace.yaml
  - configmap.yaml
  - services.yaml
  - api-deployment.yaml
  - worker-deployment.yaml
  - frontend-deployment.yaml
  - ingress.yaml
