# Static bundle only. The Ingress splits API paths off before they reach here,
# so this server never proxies anything.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React Router owns /library, /history, /practice/:id, /results/:jobId —
    # none of which exist as files. Without this, a refresh or a pasted deep
    # link 404s instead of loading the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames are content-addressed, so they can be cached hard;
    # index.html must not be, or a redeploy keeps serving the old bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
