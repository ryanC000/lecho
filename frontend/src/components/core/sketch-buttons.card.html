<!-- @dsCard group="Components" viewport="760x300" name="Hand-drawn Buttons" subtitle="Five sketchbook treatments beyond Button's sketch shape" -->
<link rel="stylesheet" href="../../styles.css">
<div style="background:var(--paper);padding:28px;display:flex;flex-direction:column;gap:26px">
  <div style="display:flex;gap:26px;flex-wrap:wrap;align-items:center">
    <button style="position:relative;font-family:var(--font-hand);font-weight:700;font-size:var(--text-small);background:var(--accent-primary);color:var(--text-on-accent);border:2px solid var(--accent-primary);border-radius:14px 26px 12px 22px / 22px 12px 24px 14px;padding:11px 22px;cursor:pointer">
      <span style="position:absolute;inset:-5px;border:2px solid var(--accent-primary);border-radius:22px 12px 24px 14px / 14px 26px 12px 22px;opacity:.4;transform:rotate(-.7deg)"></span>Start Recording</button>
    <button style="font-family:var(--font-hand);font-weight:700;font-size:var(--text-micro);letter-spacing:.16em;text-transform:uppercase;background:transparent;color:var(--accent-primary);border:2px dashed var(--accent-primary);border-radius:var(--radius-sm);padding:13px 24px;cursor:pointer;transform:rotate(-1.5deg)">Start Recording</button>
    <button style="position:relative;font-family:var(--font-hand);font-weight:700;font-size:var(--text-small);background:transparent;color:var(--text-primary);border:none;padding:10px 18px;cursor:pointer">
      <span style="position:absolute;left:-4px;right:-4px;top:2px;bottom:2px;background:rgba(212,152,42,.72);clip-path:polygon(1% 6%, 99% 0, 100% 88%, 97% 100%, 3% 96%, 0 12%);transform:rotate(-.6deg)"></span><span style="position:relative">Start Recording</span></button>
  </div>
  <div style="display:flex;gap:26px;flex-wrap:wrap;align-items:center">
    <button style="font-family:var(--font-hand);font-weight:700;font-size:var(--text-small);background:var(--accent-primary);color:var(--text-on-accent);border:none;padding:13px 26px 18px;cursor:pointer;clip-path:polygon(0 0, 100% 0, 100% calc(100% - 6px), 88% 100%, 74% calc(100% - 5px), 60% calc(100% - 1px), 46% calc(100% - 7px), 32% calc(100% - 2px), 18% 100%, 6% calc(100% - 4px), 0 calc(100% - 7px))">Start Recording</button>
    <button style="position:relative;font-family:var(--font-hand);font-weight:700;font-size:var(--text-small);background:var(--accent-primary);color:var(--text-on-accent);border:2px solid var(--accent-primary);border-radius:14px 26px 12px 22px / 22px 12px 24px 14px;padding:12px 22px;cursor:pointer;box-shadow:var(--shadow-sticker);transform:rotate(-1deg)">
      <span style="position:absolute;top:-5px;left:14px;width:10px;height:10px;border-radius:50%;background:var(--text-primary);box-shadow:0 2px 3px rgba(59,49,39,.35)"></span>Start Recording</button>
    <span style="font-family:var(--font-hand);font-size:var(--text-micro);color:var(--text-secondary);letter-spacing:.1em;text-transform:uppercase">double · stamp · marker · torn · pinned</span>
  </div>
</div>
